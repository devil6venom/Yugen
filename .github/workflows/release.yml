name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom tag name (optional, defaults to vX.Y.Z-stable)'
        required: false
        default: ''

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_release:
    if: github.repository == 'devil6venom/Yugen'
    name: Prepare Tag and Version
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      version: ${{ steps.set_tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag name
        id: set_tag
        run: |
          VERSION=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag_name }}"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            else
              TAG="v$VERSION-stable-${{ github.run_number }}"
            fi
          else
            TAG="${GITHUB_REF/refs\/tags\//}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate Release Body
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"
          VER="${{ steps.set_tag.outputs.version }}"

          git fetch --tags --force
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)

          echo "## Release $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Built from version $VER." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Changes since $PREV_TAG" >> release_notes.md

          # Limit to 100 commits to avoid "Argument list too long" errors
          git log $PREV_TAG..HEAD --oneline --pretty=format:"* %h %s" | head -n 100 >> release_notes.md

          if [ $(git rev-list --count $PREV_TAG..HEAD) -gt 100 ]; then
            echo "" >> release_notes.md
            echo "*... and more. [See full diff](https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG)*" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "### Downloads" >> release_notes.md
          echo "* \`yugen-arm64-v${VER}-stable.apk\` (Recommended)" >> release_notes.md
          echo "* \`yugen-armv7-v${VER}-stable.apk\`" >> release_notes.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag ${{ steps.set_tag.outputs.tag }}
          git push origin ${{ steps.set_tag.outputs.tag }}

  build:
    if: github.repository == 'devil6venom/Yugen'
    name: Build and Sign
    runs-on: 'ubuntu-24.04'
    needs: prepare_release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename APK
        run: |
          VER="${{ needs.prepare_release.outputs.version }}"
          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk yugen-arm64-v${VER}-stable.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk yugen-armv7-v${VER}-stable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yugen-apks
          path: |
            yugen-arm64-v${{ needs.prepare_release.outputs.version }}-stable.apk
            yugen-armv7-v${{ needs.prepare_release.outputs.version }}-stable.apk

  release:
    if: github.repository == 'devil6venom/Yugen'
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [prepare_release, build]
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: yugen-apks

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          name: Yugen ${{ needs.prepare_release.outputs.tag }}
          body_path: release_notes.md
          files: |
            yugen-arm64-v${{ needs.prepare_release.outputs.version }}-stable.apk
            yugen-armv7-v${{ needs.prepare_release.outputs.version }}-stable.apk
          draft: false
          prerelease: false
          generate_release_notes: false
          token: ${{ secrets.MIHON_BOT_TOKEN || secrets.GITHUB_TOKEN }}
