name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom tag name (optional, defaults to vX.Y.Z-stable)'
        required: false
        default: ''

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_release:
    if: github.repository == 'devil6venom/Yugen'
    name: Prepare Tag and Version
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      version: ${{ steps.set_tag.outputs.version }}
      changelog: ${{ steps.gen_changelog.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag name
        id: set_tag
        run: |
          VERSION=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag_name }}"
            if [ -n "$INPUT_TAG" ]; then
              echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
            else
              # Use stable suffix for manual runs
              echo "tag=v$VERSION-stable-${{ github.run_number }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog
        id: gen_changelog
        run: |
          # Fetch all tags to ensure git describe works
          git fetch --tags --force

          # Find the previous tag before current HEAD
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)

          echo "### Changes since $PREV_TAG" > changelog.md
          git log $PREV_TAG..HEAD --oneline --pretty=format:"* %h %s" >> changelog.md
          echo "" >> changelog.md

          # Use a random delimiter to avoid "Matching delimiter not found" error
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag ${{ steps.set_tag.outputs.tag }}
          git push origin ${{ steps.set_tag.outputs.tag }}

  build:
    if: github.repository == 'devil6venom/Yugen'
    name: Build and Sign
    runs-on: 'ubuntu-24.04'
    needs: prepare_release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename APK
        run: |
          VER="${{ needs.prepare_release.outputs.version }}"
          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk yugen-arm64-v${VER}-stable.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk yugen-armv7-v${VER}-stable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yugen-apks
          path: |
            yugen-arm64-v${{ needs.prepare_release.outputs.version }}-stable.apk
            yugen-armv7-v${{ needs.prepare_release.outputs.version }}-stable.apk

  release:
    if: github.repository == 'devil6venom/Yugen'
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [prepare_release, build]
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: yugen-apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          name: Yugen ${{ needs.prepare_release.outputs.tag }}
          body: |
            ## Release ${{ needs.prepare_release.outputs.tag }}

            Built from version ${{ needs.prepare_release.outputs.version }}.

            ${{ needs.prepare_release.outputs.changelog }}

            ### Downloads
            * `yugen-arm64-v${{ needs.prepare_release.outputs.version }}-stable.apk` (Recommended)
            * `yugen-armv7-v${{ needs.prepare_release.outputs.version }}-stable.apk`
          files: |
            yugen-arm64-v${{ needs.prepare_release.outputs.version }}-stable.apk
            yugen-armv7-v${{ needs.prepare_release.outputs.version }}-stable.apk
          draft: false
          prerelease: false
          generate_release_notes: false
          token: ${{ secrets.MIHON_BOT_TOKEN || secrets.GITHUB_TOKEN }}
